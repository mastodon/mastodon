      feature_audience: Mastodon vám umožňuje budovať si publikum bez sprostredkovateľov. Ak ho prevádzkujete na vlastnej infraštruktúre, môžete sledovať ľudí na ktoromkoľvek inom serveri Mastodon a oni môžu sledovať vás. Váš server máte pod kontrolou vy.
