        authorized_fetch_hints:
          actors: Vyžadovanie overenia pri profiloch umožňuje zaznamenať, ktoré servery už objavili jednotlivé miestne účty. Pri upozorňovaní serverov na odstránenie účtu sa tým môže výrazne znížiť počet zbytočných požiadaviek. Pri zobrazovaní profilov môže mierne klesnúť výkon, pretože server vedie tieto záznamy a reverzný proxy server nemôže ukladať odpovede na tieto požiadavky do vyrovnávacej pamäte. Pri niektorých federovaných službách môžu nastať problémy s kompatibilitou.
          all: Povinné overovanie všetkých požiadaviek z federovaných serverov prináša rovnaké výhody a nevýhody ako overovanie pri profiloch. Umožňuje dôslednejšie uplatňovať blokovania používateľov aj serverov a zároveň znemožňuje ukladať väčšinu požiadaviek do vyrovnávacej pamäte. Zníži sa aj dosah odpovedí, pretože sa vypne ich preposielanie.
          none: Ak sa overenie vyžaduje iba v nevyhnutných prípadoch, reverzný proxy server môže ukladať viac odpovedí do vyrovnávacej pamäte. Táto možnosť môže v budúcnosti zaniknúť. Použite ju iba vtedy, ak ostatné možnosti spôsobujú problémy.
